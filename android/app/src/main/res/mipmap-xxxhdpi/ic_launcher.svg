<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <!-- Background gradient -->
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%">
      <stop offset="0%" style="stop-color:#FFD700;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FF6B35;stop-opacity:1" />
    </radialGradient>
    <radialGradient id="glowGrad" cx="50%" cy="50%">
      <stop offset="0%" style="stop-color:#FFFFFF;stop-opacity:0.5" />
      <stop offset="100%" style="stop-color:#FFD700;stop-opacity:0" />
    </radialGradient>
  </defs>
  
  <!-- Background -->
  <rect width="512" height="512" fill="url(#bgGrad)" rx="115"/>
  
  <!-- Sun rays -->
  <g opacity="0.3" transform="translate(256, 220)">
    <line x1="0" y1="-120" x2="0" y2="-80" stroke="#FFE082" stroke-width="6" stroke-linecap="round"/>
    <line x1="0" y1="-120" x2="0" y2="-80" stroke="#FFE082" stroke-width="6" stroke-linecap="round" transform="rotate(45)"/>
    <line x1="0" y1="-120" x2="0" y2="-80" stroke="#FFE082" stroke-width="6" stroke-linecap="round" transform="rotate(90)"/>
    <line x1="0" y1="-120" x2="0" y2="-80" stroke="#FFE082" stroke-width="6" stroke-linecap="round" transform="rotate(135)"/>
    <line x1="0" y1="-120" x2="0" y2="-80" stroke="#FFE082" stroke-width="6" stroke-linecap="round" transform="rotate(180)"/>
    <line x1="0" y1="-120" x2="0" y2="-80" stroke="#FFE082" stroke-width="6" stroke-linecap="round" transform="rotate(225)"/>
    <line x1="0" y1="-120" x2="0" y2="-80" stroke="#FFE082" stroke-width="6" stroke-linecap="round" transform="rotate(270)"/>
    <line x1="0" y1="-120" x2="0" y2="-80" stroke="#FFE082" stroke-width="6" stroke-linecap="round" transform="rotate(315)"/>
  </g>
  
  <!-- Central glow -->
  <circle cx="256" cy="256" r="140" fill="url(#glowGrad)"/>
  
  <!-- Diya (Oil lamp) -->
  <g transform="translate(256, 280)">
    <!-- Flame -->
    <ellipse cx="0" cy="-55" rx="18" ry="35" fill="#FFF9C4"/>
    <ellipse cx="0" cy="-55" rx="12" ry="28" fill="#FFD54F"/>
    <ellipse cx="0" cy="-55" rx="6" ry="18" fill="#FFF176"/>
    
    <!-- Flame top glow -->
    <circle cx="0" cy="-75" r="4" fill="#FFFFFF" opacity="0.8"/>
    
    <!-- Wick -->
    <rect x="-2" y="-20" width="4" height="15" fill="#8D6E63" rx="1"/>
    
    <!-- Diya body -->
    <ellipse cx="0" cy="-5" rx="45" ry="18" fill="#FFFFFF"/>
    <ellipse cx="0" cy="-5" rx="42" ry="15" fill="#FFF3E0"/>
    
    <!-- Diya rim -->
    <ellipse cx="0" cy="-5" rx="50" ry="12" fill="none" stroke="#FFB74D" stroke-width="3"/>
    
    <!-- Diya left curve -->
    <path d="M -50,-5 Q -65,-5 -70,-12 Q -72,-16 -70,-20 L -50,-5" fill="#FFD54F"/>
    
    <!-- Diya right curve -->
    <path d="M 50,-5 Q 65,-5 70,-12 Q 72,-16 70,-20 L 50,-5" fill="#FFD54F"/>
    
    <!-- Base shadow -->
    <ellipse cx="0" cy="5" rx="48" ry="8" fill="#FF8A65" opacity="0.4"/>
  </g>
  
  <!-- Om symbol (subtle, top) -->
  <g transform="translate(256, 130)" opacity="0.3">
    <text text-anchor="middle" font-family="serif" font-size="45" font-weight="bold" fill="#FFFFFF">ॐ</text>
  </g>
  
  <!-- Decorative dots -->
  <circle cx="140" cy="370" r="4" fill="#FFFFFF" opacity="0.6"/>
  <circle cx="170" cy="390" r="3" fill="#FFFFFF" opacity="0.5"/>
  <circle cx="372" cy="370" r="4" fill="#FFFFFF" opacity="0.6"/>
  <circle cx="342" cy="390" r="3" fill="#FFFFFF" opacity="0.5"/>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF6B35"/>
      <stop offset="50%" style="stop-color:#FF9933"/>
      <stop offset="100%" style="stop-color:#FFD700"/>
    </linearGradient>
    <linearGradient id="omGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFFFFF"/>
      <stop offset="100%" style="stop-color:#FFF8DC"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="shadow">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="512" height="512" rx="80" fill="url(#bg)"/>
  
  <!-- Mandala pattern (subtle) -->
  <circle cx="256" cy="256" r="200" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="2"/>
  <circle cx="256" cy="256" r="160" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="2"/>
  <circle cx="256" cy="256" r="120" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="2"/>
  
  <!-- Glow behind Om -->
  <circle cx="256" cy="256" r="100" fill="rgba(255,255,255,0.2)" filter="url(#glow)"/>
  
  <!-- Om Symbol (ॐ) -->
  <text x="256" y="300" 
        font-family="Arial, sans-serif" 
        font-size="220" 
        font-weight="bold"
        fill="url(#omGlow)" 
        text-anchor="middle"
        filter="url(#shadow)">ॐ</text>
  
  <!-- Small decorative dots -->
  <circle cx="120" cy="120" r="8" fill="rgba(255,255,255,0.4)"/>
  <circle cx="392" cy="120" r="8" fill="rgba(255,255,255,0.4)"/>
  <circle cx="120" cy="392" r="8" fill="rgba(255,255,255,0.4)"/>
  <circle cx="392" cy="392" r="8" fill="rgba(255,255,255,0.4)"/>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Background - Saffron Gradient -->
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF6B35"/>
      <stop offset="50%" style="stop-color:#FF9933"/>
      <stop offset="100%" style="stop-color:#FFD700"/>
    </linearGradient>
    <linearGradient id="flame" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" style="stop-color:#FFD700"/>
      <stop offset="50%" style="stop-color:#FF9933"/>
      <stop offset="100%" style="stop-color:#FF6B35"/>
    </linearGradient>
  </defs>
  
  <!-- Rounded Square Background -->
  <rect width="512" height="512" rx="100" fill="url(#bg)"/>
  
  <!-- Diya (Oil Lamp) Base -->
  <ellipse cx="256" cy="350" rx="100" ry="25" fill="#8B4513"/>
  <ellipse cx="256" cy="340" rx="90" ry="20" fill="#A0522D"/>
  <path d="M176 340 Q176 280 256 280 Q336 280 336 340" fill="#CD853F"/>
  
  <!-- Diya Inner -->
  <ellipse cx="256" cy="300" rx="60" ry="15" fill="#DEB887"/>
  
  <!-- Flame -->
  <path d="M256 280 Q280 220 256 160 Q232 220 256 280" fill="url(#flame)"/>
  <path d="M256 260 Q270 210 256 170 Q242 210 256 260" fill="#FFFF00" opacity="0.8"/>
  
  <!-- Om Symbol -->
  <text x="256" y="130" text-anchor="middle" font-size="80" font-family="serif" fill="white" font-weight="bold">ॐ</text>
  
  <!-- Subtle Glow Effect -->
  <circle cx="256" cy="200" r="80" fill="#FFFF00" opacity="0.1"/>
</svg>
